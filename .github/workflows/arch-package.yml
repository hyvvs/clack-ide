name: Arch Package

on:
  workflow_run:
    workflows: ["Release"]
    types: [completed]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag (for example v0.8.0)"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: arch-package-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-arch-package:
    name: Build native Arch package
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    timeout-minutes: 90
    env:
      BUILD_USER: builder
      BUILD_HOME: /home/builder
      CARGO_HOME: /home/builder/.cargo
      RUSTUP_HOME: /home/builder/.rustup
      CARGO_TERM_COLOR: always
    outputs:
      release_tag: ${{ steps.release.outputs.tag }}
      release_version: ${{ steps.release.outputs.version }}

    steps:
      - name: Install checkout prerequisites
        shell: bash
        run: |
          set -euo pipefail
          pacman -Syu --noconfirm git

      - name: Check out repository
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.event.workflow_run.head_sha }}
          fetch-depth: 0
          fetch-tags: true

      - name: Install Arch build dependencies
        shell: bash
        run: |
          set -euo pipefail
          pacman -S --needed --noconfirm \
            desktop-file-utils \
            file \
            git \
            gtk3 \
            libappindicator-gtk3 \
            librsvg \
            namcap \
            nodejs \
            npm \
            openssl \
            pkgconf \
            rustup \
            webkit2gtk-4.1 \
            xdg-utils

      - name: Validate release tag and version
        id: release
        shell: bash
        env:
          REQUESTED_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.event.workflow_run.head_branch }}
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"
          expected_tag="v$version"
          if [[ "$REQUESTED_TAG" != "$expected_tag" ]]; then
            echo "::error::Release ref $REQUESTED_TAG does not match package version $expected_tag."
            exit 1
          fi

          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git fetch --force origin \
            "refs/tags/$expected_tag:refs/tags/$expected_tag"
          if ! tag_commit="$(git rev-list -n 1 "$expected_tag")"; then
            echo "::error::Release tag does not resolve: $expected_tag"
            exit 1
          fi
          head_commit="$(git rev-parse HEAD)"
          if [[ "$tag_commit" != "$head_commit" ]]; then
            echo "::error::Release tag $expected_tag resolves to $tag_commit, but the checked-out commit is $head_commit."
            exit 1
          fi

          echo "tag=$expected_tag" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "::notice::Validated $expected_tag at $head_commit"

      - name: Create unprivileged package builder
        shell: bash
        run: |
          set -euo pipefail
          useradd --create-home --shell /bin/bash "$BUILD_USER"
          chown -R "$BUILD_USER:$BUILD_USER" "$GITHUB_WORKSPACE"
          install -d -o "$BUILD_USER" -g "$BUILD_USER" "$CARGO_HOME" "$RUSTUP_HOME"

      - name: Install stable Rust
        shell: bash
        run: |
          set -euo pipefail
          runuser -u "$BUILD_USER" -- env \
            HOME="$BUILD_HOME" \
            CARGO_HOME="$CARGO_HOME" \
            RUSTUP_HOME="$RUSTUP_HOME" \
            PATH="$CARGO_HOME/bin:$PATH" \
            rustup default stable
          runuser -u "$BUILD_USER" -- env \
            HOME="$BUILD_HOME" \
            CARGO_HOME="$CARGO_HOME" \
            RUSTUP_HOME="$RUSTUP_HOME" \
            PATH="$CARGO_HOME/bin:$PATH" \
            rustup component add clippy rustfmt

      - name: Install npm dependencies
        shell: bash
        run: |
          set -euo pipefail
          runuser -u "$BUILD_USER" -- env HOME="$BUILD_HOME" PATH="$CARGO_HOME/bin:$PATH" node --version
          runuser -u "$BUILD_USER" -- env HOME="$BUILD_HOME" PATH="$CARGO_HOME/bin:$PATH" npm --version
          runuser -u "$BUILD_USER" -- env HOME="$BUILD_HOME" PATH="$CARGO_HOME/bin:$PATH" npm ci

      - name: Verify frontend
        shell: bash
        run: |
          set -euo pipefail
          runuser -u "$BUILD_USER" -- env HOME="$BUILD_HOME" PATH="$CARGO_HOME/bin:$PATH" npm run check-types
          runuser -u "$BUILD_USER" -- env HOME="$BUILD_HOME" PATH="$CARGO_HOME/bin:$PATH" npm run lint
          runuser -u "$BUILD_USER" -- env HOME="$BUILD_HOME" PATH="$CARGO_HOME/bin:$PATH" npm test
          runuser -u "$BUILD_USER" -- env HOME="$BUILD_HOME" PATH="$CARGO_HOME/bin:$PATH" npm run build

      - name: Verify application Rust
        shell: bash
        run: |
          set -euo pipefail
          runuser -u "$BUILD_USER" -- env \
            HOME="$BUILD_HOME" CARGO_HOME="$CARGO_HOME" RUSTUP_HOME="$RUSTUP_HOME" PATH="$CARGO_HOME/bin:$PATH" \
            cargo fmt --manifest-path src-tauri/Cargo.toml --check
          runuser -u "$BUILD_USER" -- env \
            HOME="$BUILD_HOME" CARGO_HOME="$CARGO_HOME" RUSTUP_HOME="$RUSTUP_HOME" PATH="$CARGO_HOME/bin:$PATH" \
            cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets --locked -- -D warnings
          runuser -u "$BUILD_USER" -- env \
            HOME="$BUILD_HOME" CARGO_HOME="$CARGO_HOME" RUSTUP_HOME="$RUSTUP_HOME" PATH="$CARGO_HOME/bin:$PATH" \
            cargo test --manifest-path src-tauri/Cargo.toml --locked

      - name: Verify Linux launcher
        shell: bash
        run: |
          set -euo pipefail
          runuser -u "$BUILD_USER" -- env \
            HOME="$BUILD_HOME" CARGO_HOME="$CARGO_HOME" RUSTUP_HOME="$RUSTUP_HOME" PATH="$CARGO_HOME/bin:$PATH" \
            cargo fmt --manifest-path packaging/linux-launcher/Cargo.toml --check
          runuser -u "$BUILD_USER" -- env \
            HOME="$BUILD_HOME" CARGO_HOME="$CARGO_HOME" RUSTUP_HOME="$RUSTUP_HOME" PATH="$CARGO_HOME/bin:$PATH" \
            cargo clippy --manifest-path packaging/linux-launcher/Cargo.toml --all-targets --locked -- -D warnings
          runuser -u "$BUILD_USER" -- env \
            HOME="$BUILD_HOME" CARGO_HOME="$CARGO_HOME" RUSTUP_HOME="$RUSTUP_HOME" PATH="$CARGO_HOME/bin:$PATH" \
            cargo test --manifest-path packaging/linux-launcher/Cargo.toml --locked

      - name: Build Clack and launcher
        shell: bash
        run: |
          set -euo pipefail
          runuser -u "$BUILD_USER" -- env \
            HOME="$BUILD_HOME" CARGO_HOME="$CARGO_HOME" RUSTUP_HOME="$RUSTUP_HOME" PATH="$CARGO_HOME/bin:$PATH" \
            npm run tauri -- build --no-bundle
          runuser -u "$BUILD_USER" -- env \
            HOME="$BUILD_HOME" CARGO_HOME="$CARGO_HOME" RUSTUP_HOME="$RUSTUP_HOME" PATH="$CARGO_HOME/bin:$PATH" \
            cargo build --manifest-path packaging/linux-launcher/Cargo.toml --release --locked
          test -x src-tauri/target/release/clack
          test -x packaging/linux-launcher/target/release/clack-linux-launcher

      - name: Prepare package inputs
        shell: bash
        run: |
          set -euo pipefail
          rm -rf packaging/arch/.build
          runuser -u "$BUILD_USER" -- mkdir -p packaging/arch/.build
          runuser -u "$BUILD_USER" -- env HOME="$BUILD_HOME" \
            node packaging/arch/prepare-package.mjs packaging/arch/.build
          desktop-file-validate packaging/arch/.build/clack.desktop

      - name: Build package with unprivileged makepkg
        shell: bash
        run: |
          set -euo pipefail
          runuser -u "$BUILD_USER" -- env HOME="$BUILD_HOME" \
            bash -lc 'cd "$GITHUB_WORKSPACE/packaging/arch/.build" && makepkg --cleanbuild --clean --force --noconfirm'
          test -f "packaging/arch/.build/clack-$(node -p "require('./package.json').version")-1-x86_64.pkg.tar.zst"

      - name: Inspect package metadata and contents
        shell: bash
        run: |
          set -euo pipefail
          package="packaging/arch/.build/clack-$(node -p "require('./package.json').version")-1-x86_64.pkg.tar.zst"
          pacman -Qip "$package"
          pacman -Qlp "$package"
          namcap packaging/arch/.build/PKGBUILD | tee packaging/arch/.build/namcap-pkgbuild.txt
          namcap "$package" | tee packaging/arch/.build/namcap-package.txt
          if grep -Eq '(^|[[:space:]])E:' packaging/arch/.build/namcap-pkgbuild.txt packaging/arch/.build/namcap-package.txt; then
            echo "::error::namcap reported a package error."
            exit 1
          fi

      - name: Prepare artifact
        shell: bash
        run: |
          set -euo pipefail
          package="packaging/arch/.build/clack-$(node -p "require('./package.json').version")-1-x86_64.pkg.tar.zst"
          rm -rf arch-artifact
          mkdir arch-artifact
          cp "$package" arch-artifact/
          cp packaging/arch/ARCH_PACKAGE_README.txt arch-artifact/
          cd arch-artifact
          sha256sum "$(basename "$package")" > SHA256SUMS.txt
          sha256sum --check SHA256SUMS.txt

      - name: Upload native Arch package
        uses: actions/upload-artifact@v7
        with:
          name: clack-arch-package
          path: arch-artifact/*
          if-no-files-found: error
          retention-days: 14

  verify-clean-install:
    name: Verify clean Arch package install
    needs: build-arch-package
    runs-on: ubuntu-latest
    container: archlinux:base
    timeout-minutes: 35

    steps:
      - name: Download native Arch package
        uses: actions/download-artifact@v7
        with:
          name: clack-arch-package
          path: arch-artifact

      - name: Verify artifact checksum
        shell: bash
        run: |
          set -euo pipefail
          cd arch-artifact
          sha256sum --check SHA256SUMS.txt

      - name: Update clean Arch environment
        run: pacman -Syu --noconfirm

      - name: Install package and resolved runtime dependencies
        shell: bash
        run: |
          set -euo pipefail
          package="$(find arch-artifact -maxdepth 1 -name 'clack-*-1-x86_64.pkg.tar.zst' -print -quit)"
          test -n "$package"

          if grep -Eq '^[[:space:]]*NoExtract[[:space:]]*=.*usr/share/doc/' /etc/pacman.conf; then
            echo "::notice::Removing the container's documentation NoExtract rule for package validation"
            sed -i -E '\|^[[:space:]]*NoExtract[[:space:]]*=.*usr/share/doc/|d' /etc/pacman.conf
          fi

          pacman -U --noconfirm "$package"
          pacman -Q clack
          pacman -Ql clack

      - name: Validate installed files and dynamic libraries
        shell: bash
        run: |
          set -euo pipefail

          print_parent_contents() {
            local path="$1"
            local parent
            local listing_directory
            parent="$(dirname "$path")"
            listing_directory="$parent"
            echo "::group::Contents of $parent"
            while [[ ! -d "$listing_directory" && "$listing_directory" != "/" ]]; do
              echo "Directory does not exist: $listing_directory"
              listing_directory="$(dirname "$listing_directory")"
            done
            echo "Nearest existing parent: $listing_directory"
            ls -la -- "$listing_directory"
            echo "::endgroup::"
          }

          require_executable() {
            local path="$1"
            if [[ -x "$path" ]]; then
              echo "::notice::Installed executable found: $path"
              return
            fi
            echo "::error::Expected installed executable is missing or not executable: $path"
            print_parent_contents "$path"
            return 1
          }

          require_regular_file() {
            local path="$1"
            if [[ -f "$path" ]]; then
              echo "::notice::Installed file found: $path"
              return
            fi
            echo "::error::Expected installed regular file is missing: $path"
            print_parent_contents "$path"
            return 1
          }

          require_not_symlink() {
            local path="$1"
            if [[ ! -L "$path" ]]; then
              echo "::notice::Installed path is not a symlink: $path"
              return
            fi
            echo "::error::Expected a real compiled launcher, but the installed path is a symlink: $path"
            print_parent_contents "$path"
            return 1
          }

          pacman -Ql clack

          if pacman -Qq desktop-file-utils >/dev/null 2>&1; then
            echo "::notice::desktop-file-utils is already installed"
          else
            pacman -S --noconfirm desktop-file-utils
          fi

          require_executable /usr/bin/clack
          require_not_symlink /usr/bin/clack
          require_executable /usr/lib/clack/clack-bin
          require_regular_file /usr/share/applications/clack.desktop
          require_regular_file /usr/share/icons/hicolor/32x32/apps/clack.png
          require_regular_file /usr/share/icons/hicolor/128x128/apps/clack.png
          require_regular_file /usr/share/icons/hicolor/256x256/apps/clack.png
          require_regular_file /usr/share/doc/clack/ARCH_PACKAGE_README.txt

          desktop-file-validate /usr/share/applications/clack.desktop
          echo "::notice::Desktop entry validation passed: /usr/share/applications/clack.desktop"

          ldd /usr/bin/clack | tee /tmp/clack-launcher-ldd.txt
          ldd /usr/lib/clack/clack-bin | tee /tmp/clack-application-ldd.txt
          if grep -F "not found" /tmp/clack-launcher-ldd.txt /tmp/clack-application-ldd.txt; then
            echo "::error::An installed Clack executable has a missing dynamic library."
            exit 1
          fi
          echo "::notice::Dynamic library validation passed for both Clack executables"

      - name: Verify clean uninstall
        shell: bash
        run: |
          set -euo pipefail
          pacman -Rns --noconfirm clack
          test ! -e /usr/bin/clack
          test ! -e /usr/lib/clack/clack-bin

  publish-release:
    name: Attach Arch package and publish release
    needs: [build-arch-package, verify-clean-install]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ needs.build-arch-package.outputs.release_tag }}
      RELEASE_VERSION: ${{ needs.build-arch-package.outputs.release_version }}

    steps:
      - name: Download validated Arch package
        uses: actions/download-artifact@v7
        with:
          name: clack-arch-package
          path: arch-artifact

      - name: Attach package and verify complete release
        shell: bash
        run: |
          set -euo pipefail
          package="arch-artifact/clack-$RELEASE_VERSION-1-x86_64.pkg.tar.zst"
          test -f "$package"
          (
            cd arch-artifact
            sha256sum --check SHA256SUMS.txt
          )

          gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null
          gh release upload "$RELEASE_TAG" \
            "$package" \
            arch-artifact/SHA256SUMS.txt \
            arch-artifact/ARCH_PACKAGE_README.txt \
            --clobber \
            --repo "$GITHUB_REPOSITORY"

          gh release view "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --json assets \
            --jq '.assets[].name' > release-assets.txt

          require_asset() {
            local asset="$1"
            if grep -Fxq "$asset" release-assets.txt; then
              echo "::notice::Release asset found: $asset"
              return
            fi
            echo "::error::Expected release asset is missing: $asset"
            echo "::group::Available release assets"
            cat release-assets.txt
            echo "::endgroup::"
            return 1
          }

          require_asset "Clack_${RELEASE_VERSION}_x64_en-US.msi"
          require_asset "Clack_${RELEASE_VERSION}_x64-setup.exe"
          require_asset "Clack_${RELEASE_VERSION}_amd64.deb"
          require_asset "Clack-${RELEASE_VERSION}-1.x86_64.rpm"
          require_asset "Clack_${RELEASE_VERSION}_amd64.AppImage"
          require_asset "Clack_${RELEASE_VERSION}_aarch64.dmg"
          require_asset "Clack_${RELEASE_VERSION}_x64.dmg"
          require_asset "Clack_aarch64.app.tar.gz"
          require_asset "Clack_x64.app.tar.gz"
          require_asset "clack-${RELEASE_VERSION}-1-x86_64.pkg.tar.zst"
          require_asset "SHA256SUMS.txt"
          require_asset "ARCH_PACKAGE_README.txt"

      - name: Publish completed release
        shell: bash
        run: |
          set -euo pipefail
          cat > release-notes.md <<EOF
          Clack $RELEASE_VERSION packages for Windows, Linux, macOS, and native Arch/CachyOS.

          The native Arch package installs the compiled launcher at /usr/bin/clack and the application binary at /usr/lib/clack/clack-bin. On proprietary NVIDIA with Wayland, the launcher conditionally applies the process-local explicit-sync workaround.

          macOS signing and notarization are applied only when the repository's Apple release credentials are configured. Unsigned macOS packages may require explicit approval in Gatekeeper.

          The AppImage is experimental on affected proprietary-NVIDIA/Wayland systems. Prefer the native Arch package on Arch or CachyOS.
          EOF

          gh release edit "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --title "Clack $RELEASE_TAG" \
            --notes-file release-notes.md

          is_draft="$(gh release view "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --json isDraft \
            --jq '.isDraft')"
          if [[ "$is_draft" == "true" ]]; then
            gh release edit "$RELEASE_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --draft=false
            echo "::notice::Published release $RELEASE_TAG"
          else
            echo "::notice::Release $RELEASE_TAG was already published"
          fi
