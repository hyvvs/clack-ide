name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag (for example v0.8.0)"
        required: true
        type: string

jobs:
  publish-tauri:
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # macOS 26 currently rejects Tauri's implicit PKCS#12 certificate
          # import. Pin macOS 15 until the upstream import fix is available.
          - platform: macos-15
            args: --target aarch64-apple-darwin
            rust-target: aarch64-apple-darwin
          - platform: macos-15-intel
            args: --target x86_64-apple-darwin
            rust-target: x86_64-apple-darwin
          - platform: ubuntu-22.04
            args: ""
            rust-target: ""
          - platform: windows-latest
            args: ""
            rust-target: ""

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Install Linux build dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            librsvg2-dev \
            libssl-dev \
            patchelf

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-target }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri -> target
          key: ${{ matrix.platform }}-${{ matrix.rust-target }}

      - name: Install frontend dependencies
        run: npm ci

      - name: Validate release tag
        run: >-
          node -e "const expected = 'v' + require('./package.json').version;
          if (process.env.RELEASE_TAG !== expected) {
          console.error('Release tag ' + process.env.RELEASE_TAG +
          ' does not match package version ' + expected); process.exit(1); }"

      - name: Write Apple API key to disk
        if: startsWith(matrix.platform, 'macos')
        shell: bash
        env:
          KEY_CONTENT: ${{ secrets.APPLE_API_KEY_PATH }}
        run: |
          mkdir -p "$HOME/private_keys"
          printf '%s' "$KEY_CONTENT" > "$HOME/private_keys/AuthKey.p8"
          echo "APPLE_API_KEY_PATH=$HOME/private_keys/AuthKey.p8" >> "$GITHUB_ENV"

      - name: Import Apple signing certificate
        if: startsWith(matrix.platform, 'macos')
        shell: bash
        env:
          CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE }}
          CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          set -euo pipefail
          CERTIFICATE_PATH="$RUNNER_TEMP/clack-signing.p12"
          KEYCHAIN_PATH="$RUNNER_TEMP/clack-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 24)"

          if ! printf '%s' "$CERTIFICATE_BASE64" \
            | openssl base64 -d -A -out "$CERTIFICATE_PATH"; then
            echo "::error::APPLE_CERTIFICATE is not valid base64-encoded PKCS#12 data."
            exit 1
          fi

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          if ! security import "$CERTIFICATE_PATH" \
            -k "$KEYCHAIN_PATH" \
            -P "$CERTIFICATE_PASSWORD" \
            -A \
            -t cert \
            -f pkcs12; then
            echo "::error::Could not import APPLE_CERTIFICATE as PKCS#12. Check the certificate data and APPLE_CERTIFICATE_PASSWORD."
            exit 1
          fi

          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s \
            -k "$KEYCHAIN_PASSWORD" \
            "$KEYCHAIN_PATH"

          KEYCHAINS=("$KEYCHAIN_PATH")
          while IFS= read -r keychain; do
            keychain="${keychain//\"/}"
            keychain="${keychain#"${keychain%%[![:space:]]*}"}"
            keychain="${keychain%"${keychain##*[![:space:]]}"}"
            if [[ -n "$keychain" && "$keychain" != "$KEYCHAIN_PATH" ]]; then
              KEYCHAINS+=("$keychain")
            fi
          done < <(security list-keychains -d user)
          security list-keychains -d user -s "${KEYCHAINS[@]}"

          SIGNING_IDENTITY="$(security find-identity -v -p codesigning "$KEYCHAIN_PATH" \
            | sed -n 's/.*"\(.*\)"/\1/p' \
            | sed -n '1p')"
          if [[ -z "$SIGNING_IDENTITY" ]]; then
            echo "::error::APPLE_CERTIFICATE contains no usable code-signing identity."
            exit 1
          fi
          echo "APPLE_SIGNING_IDENTITY=$SIGNING_IDENTITY" >> "$GITHUB_ENV"

      - id: tauri
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPLE_SIGNING_IDENTITY: ${{ env.APPLE_SIGNING_IDENTITY }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
        with:
          tagName: ${{ env.RELEASE_TAG }}
          releaseName: "Clack ${{ env.RELEASE_TAG }}"
          releaseBody: "See the attached platform installers and packages."
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}

      - name: Clean up Apple signing certificate
        if: always() && startsWith(matrix.platform, 'macos')
        shell: bash
        run: |
          set -euo pipefail
          KEYCHAIN_PATH="$RUNNER_TEMP/clack-signing.keychain-db"
          if [[ -f "$KEYCHAIN_PATH" ]]; then
            security delete-keychain "$KEYCHAIN_PATH"
          fi
          rm -f "$RUNNER_TEMP/clack-signing.p12"

      - name: Upload macOS app archive for Nix
        if: startsWith(matrix.platform, 'macos')
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          case "${{ matrix.rust-target }}" in
            aarch64-apple-darwin) ARCHIVE="Clack_aarch64.app.tar.gz" ;;
            x86_64-apple-darwin) ARCHIVE="Clack_x64.app.tar.gz" ;;
            *) echo "unsupported macOS target: ${{ matrix.rust-target }}"; exit 1 ;;
          esac
          APP_DIR="src-tauri/target/${{ matrix.rust-target }}/release/bundle/macos"
          test -d "$APP_DIR/Clack.app" \
            || { echo "Clack.app missing from $APP_DIR"; exit 1; }
          tar -czf "$ARCHIVE" -C "$APP_DIR" Clack.app
          gh release upload "$RELEASE_TAG" "$ARCHIVE" \
            --clobber --repo "$GITHUB_REPOSITORY"

      # Strip the bundled libwayland-* libs from the AppImage so it loads the
      # host copies at runtime. The Ubuntu 22.04 build host ships libwayland
      # 1.20, but recent Mesa (Fedora 43 / Arch / Bazzite, Mesa 1.22+) needs
      # newer symbols; AppImage puts its bundled libs first on the search path,
      # so the stale copy wins and EGL fails with EGL_BAD_PARAMETER. libgdk-3
      # hard-links these three, so removing them only redirects resolution to
      # the host copy, which every GTK-capable system has. They are on the
      # AppImage excludelist for this exact reason. The re-signed AppImage and
      # repacked AppImage replaces the original release asset.
      - name: Fix AppImage wayland libs
        if: matrix.platform == 'ubuntu-22.04' && (startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          APPIMAGE=$(ls src-tauri/target/release/bundle/appimage/*.AppImage | head -n1)
          BASENAME=$(basename "$APPIMAGE")
          echo "Patching: $APPIMAGE"

          WORK=$(mktemp -d)
          cp "$APPIMAGE" "$WORK/"
          pushd "$WORK" >/dev/null
          chmod +x "./$BASENAME"
          "./$BASENAME" --appimage-extract >/dev/null

          # Fail loud if Tauri/linuxdeploy stops bundling these, so a future
          # layout change cannot silently ship an unfixed AppImage.
          for lib in libwayland-client.so.0 libwayland-egl.so.1 libwayland-cursor.so.0; do
            test -e "squashfs-root/usr/lib/$lib" \
              || { echo "expected bundled lib missing: $lib (layout changed?)"; exit 1; }
          done

          rm -f squashfs-root/usr/lib/libwayland-client.so.0 \
                squashfs-root/usr/lib/libwayland-egl.so.1 \
                squashfs-root/usr/lib/libwayland-cursor.so.0 \
                squashfs-root/usr/lib/libwayland-server.so.0

          curl -fsSL -o appimagetool.AppImage \
            https://github.com/AppImage/appimagetool/releases/download/1.9.1/appimagetool-x86_64.AppImage
          chmod +x appimagetool.AppImage
          ARCH=x86_64 ./appimagetool.AppImage --appimage-extract-and-run squashfs-root "$BASENAME"

          # Sanity-check the repacked image before it replaces the original.
          rm -rf squashfs-root
          chmod +x "./$BASENAME"
          "./$BASENAME" --appimage-extract >/dev/null
          for lib in libwayland-client.so.0 libwayland-egl.so.1 libwayland-cursor.so.0; do
            test ! -e "squashfs-root/usr/lib/$lib" \
              || { echo "lib still present after repack: $lib"; exit 1; }
          done
          test -x squashfs-root/usr/bin/clack \
            || { echo "clack binary missing from repacked AppImage"; exit 1; }
          popd >/dev/null

          cp "$WORK/$BASENAME" "$APPIMAGE"
          TAG="$RELEASE_TAG"
          gh release upload "$TAG" "$APPIMAGE" \
            --clobber --repo "$GITHUB_REPOSITORY"
