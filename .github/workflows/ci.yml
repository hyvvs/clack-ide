name: CI

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      source_sha:
        description: 'Existing repository commit SHA (full 40 lowercase hex characters)'
        required: true
        type: string

# A dispatched checkout may run source from a branch other than main.
# The workflow run's own SHA is not the tested source SHA or a PR check.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name == 'workflow_dispatch' && github.run_id || github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - name: Validate dispatched source SHA
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          if [[ ! "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::source_sha must be a full lowercase 40-character commit SHA"
            exit 1
          fi
      - uses: actions/checkout@v6
        with:
          # Preserve explicit dispatch identity and audit the exact PR head.
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.source_sha || github.event.pull_request.head.sha || github.sha }}
          persist-credentials: ${{ github.event_name != 'workflow_dispatch' }}
      - name: Verify dispatched source checkout
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          actual="$(git rev-parse HEAD)"
          if [[ "$actual" != "$SOURCE_SHA" ]]; then
            echo "::error::Checked-out HEAD does not match source_sha"
            exit 1
          fi
          echo "Verified source checkout: $actual"
          echo "Verified source checkout: $actual (workflow ref: $GITHUB_SHA)" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json

      - run: npm ci

      - name: Audit (advisory)
        run: npm audit --omit=dev --audit-level high
        continue-on-error: true

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npm run check-types

      - name: Test
        # Draft PRs report portable deterministic tests separately from the
        # documented physical/evidence acceptance gate. Non-draft PRs,
        # protected-main pushes and dispatches execute the complete test set.
        # A ready-for-review transition triggers a fresh complete check.
        run: ${{ github.event_name == 'pull_request' && github.event.pull_request.draft && 'npm run test:portable' || 'npm test' }}

      - name: React Compiler healthcheck (advisory)
        run: npm exec -- react-compiler-healthcheck
        continue-on-error: true

      - name: Build frontend
        id: build_frontend
        if: success() || failure()
        run: npm run build

      - name: Size budget
        if: always() && steps.build_frontend.outcome == 'success'
        run: npm run size

      # Development policy adopted from 1cb0408: same absolute gzip9 gates,
      # plus independently measured total and actual eager-graph growth.
      - name: Record exact emitted JS and actual eager modulepreload graph
        if: always() && steps.build_frontend.outcome == 'success' && github.event_name != 'workflow_dispatch'
        env:
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          [[ "$(git rev-parse HEAD)" == "$PR_HEAD_SHA" ]] || exit 2
          node scripts/emitted-js-budget.mjs snapshot \
            --dist dist --source-sha "$PR_HEAD_SHA" \
            --out "$RUNNER_TEMP/head-emitted-js.json"

      - name: Compare emitted gzip9 growth to exact PR base
        if: always() && github.event_name == 'pull_request' && steps.build_frontend.outcome == 'success'
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          [[ "$PR_BASE_SHA" =~ ^[0-9a-f]{40}$ ]] || exit 2
          git fetch --no-tags --depth=1 origin "$PR_BASE_SHA"
          git worktree add --detach "$RUNNER_TEMP/exact-pr-base" "$PR_BASE_SHA"
          (
            set -e
            cd "$RUNNER_TEMP/exact-pr-base"
            npm ci
            npm run build
          )
          node scripts/emitted-js-budget.mjs snapshot \
            --dist "$RUNNER_TEMP/exact-pr-base/dist" \
            --source-sha "$PR_BASE_SHA" \
            --out "$RUNNER_TEMP/base-emitted-js.json"
          node scripts/emitted-js-budget.mjs compare \
            --base "$RUNNER_TEMP/base-emitted-js.json" \
            --head "$RUNNER_TEMP/head-emitted-js.json" \
            --max-growth 10000 \
            --out "$RUNNER_TEMP/emitted-js-growth.json"

      - name: Dead code (advisory)
        run: npm run knip
        continue-on-error: true

  rust:
    runs-on: ubuntu-22.04
    steps:
      - name: Validate dispatched source SHA
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          if [[ ! "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::source_sha must be a full lowercase 40-character commit SHA"
            exit 1
          fi
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.source_sha || '' }}
          persist-credentials: ${{ github.event_name != 'workflow_dispatch' }}
      - name: Verify dispatched source checkout
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          actual="$(git rev-parse HEAD)"
          if [[ "$actual" != "$SOURCE_SHA" ]]; then
            echo "::error::Checked-out HEAD does not match source_sha"
            exit 1
          fi
          echo "Verified source checkout: $actual"
          echo "Verified source checkout: $actual (workflow ref: $GITHUB_SHA)" >> "$GITHUB_STEP_SUMMARY"

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            librsvg2-dev \
            libssl-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri -> target

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest,cargo-machete

      - name: cargo check
        working-directory: src-tauri
        run: cargo check --all-targets --locked

      - name: cargo clippy
        working-directory: src-tauri
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: Unused crates (advisory)
        working-directory: src-tauri
        run: cargo machete
        continue-on-error: true

      - name: cargo nextest
        working-directory: src-tauri
        run: cargo nextest run --locked

      - name: Remote SSH parent-death and ownership acceptance
        working-directory: src-tauri
        run: cargo test --locked --test remote_ssh_guardian -- --test-threads=1

  rust-platforms:
    name: rust-test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Validate dispatched source SHA
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          if [[ ! "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::source_sha must be a full lowercase 40-character commit SHA"
            exit 1
          fi
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.source_sha || '' }}
          persist-credentials: ${{ github.event_name != 'workflow_dispatch' }}
      - name: Verify dispatched source checkout
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          actual="$(git rev-parse HEAD)"
          if [[ "$actual" != "$SOURCE_SHA" ]]; then
            echo "::error::Checked-out HEAD does not match source_sha"
            exit 1
          fi
          echo "Verified source checkout: $actual"
          echo "Verified source checkout: $actual (workflow ref: $GITHUB_SHA)" >> "$GITHUB_STEP_SUMMARY"

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri -> target

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest

      - name: cargo check
        working-directory: src-tauri
        run: cargo check --all-targets --locked

      - name: cargo nextest
        working-directory: src-tauri
        run: cargo nextest run --locked --retries 2

      - name: Remote SSH native lifecycle regression
        working-directory: src-tauri
        run: cargo test --locked --lib remote_ssh

      - name: Remote SSH parent-death and ownership acceptance
        working-directory: src-tauri
        run: cargo test --locked --test remote_ssh_guardian -- --test-threads=1

  t3a-wasi:
    name: T3a WASI adversarial (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-22.04, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Validate dispatched source SHA
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          if [[ ! "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::source_sha must be a full lowercase 40-character commit SHA"
            exit 1
          fi
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.source_sha || '' }}
          persist-credentials: ${{ github.event_name != 'workflow_dispatch' }}
      - name: Verify dispatched source checkout
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          actual="$(git rev-parse HEAD)"
          if [[ "$actual" != "$SOURCE_SHA" ]]; then
            echo "::error::Checked-out HEAD does not match source_sha"
            exit 1
          fi
          echo "Verified source checkout: $actual"
          echo "Verified source checkout: $actual (workflow ref: $GITHUB_SHA)" >> "$GITHUB_STEP_SUMMARY"
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libssl-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri -> target
      - name: Shared staging, WASI adversarial and no-replay tests
        working-directory: src-tauri
        run: cargo test --locked --lib confinement
      - name: T3b registration, authorization and confined JSON functions
        working-directory: src-tauri
        run: cargo test --locked --lib custom_tools

  coverage:
    runs-on: ubuntu-22.04
    needs: rust
    steps:
      - name: Validate dispatched source SHA
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          if [[ ! "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::source_sha must be a full lowercase 40-character commit SHA"
            exit 1
          fi
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.source_sha || '' }}
          persist-credentials: ${{ github.event_name != 'workflow_dispatch' }}
      - name: Verify dispatched source checkout
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          actual="$(git rev-parse HEAD)"
          if [[ "$actual" != "$SOURCE_SHA" ]]; then
            echo "::error::Checked-out HEAD does not match source_sha"
            exit 1
          fi
          echo "Verified source checkout: $actual"
          echo "Verified source checkout: $actual (workflow ref: $GITHUB_SHA)" >> "$GITHUB_STEP_SUMMARY"

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            librsvg2-dev \
            libssl-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri -> target
          key: coverage

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov,cargo-nextest

      - name: Generate coverage
        working-directory: src-tauri
        run: cargo llvm-cov nextest --locked --lcov --output-path lcov.info

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v7
        with:
          name: lcov-report
          path: src-tauri/lcov.info
          if-no-files-found: error
