name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          # Size reports and growth review are for the exact PR head, rather
          # than an implicit synthetic merge commit with a different identity.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json

      - run: npm ci

      - name: Audit (advisory)
        run: npm audit --omit=dev --audit-level high
        continue-on-error: true

      - name: Lint
        run: npm run lint

      - name: Type-check
        if: success() || failure()
        run: npm run check-types

      - name: Portable Node-native script suites (including TF4 HTTPS and exact FORM)
        if: success() || failure()
        run: node scripts/run-node-script-tests.mjs --portable

      # These original artifacts are deliberately outside Git. Never report
      # historical acceptance as passing based on portable regression tests.
      - name: Historical acceptance status (NOT_RUN)
        if: always()
        run: |
          echo '### Historical acceptance: NOT_RUN' >> "$GITHUB_STEP_SUMMARY"
          echo 'The clean runner has no authorized original evidence. See the separate Historical Node acceptance workflow or run `node scripts/run-node-script-tests.mjs --evidence-bound` on the evidence owner checkout.' >> "$GITHUB_STEP_SUMMARY"

      - name: Test
        if: success() || failure()
        run: npm test

      - name: React Compiler healthcheck (advisory)
        run: npm exec -- react-compiler-healthcheck
        continue-on-error: true

      - name: Build frontend
        id: build_frontend
        if: success() || failure()
        run: npm run build

      - name: Size budget
        if: success() || failure()
        run: npm run size

      # The unchanged @size-limit/file command above is the hard absolute
      # gzip9 gate. This additional emitted-code audit reads the Vite HTML
      # modulepreloads and recursively follows static imports, so a change can
      # never hide eager execution growth behind named startup chunk patterns.
      - name: Record exact emitted JS and actual eager modulepreload graph
        if: always() && steps.build_frontend.outcome == 'success'
        env:
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          node scripts/emitted-js-budget.mjs snapshot \
            --dist dist --source-sha "$PR_HEAD_SHA" \
            --out "$RUNNER_TEMP/tf4-head-emitted-js.json"

      # Compare exactly the GitHub PR base SHA, not a historical initial
      # checkout or mutable local branch. Build with the same runner, Node,
      # locked dependencies, Vite command and compression algorithm as head.
      # This is a review trigger, NOT permission to exceed absolute ceilings.
      - name: Compare emitted gzip9 growth to exact PR base
        if: always() && github.event_name == 'pull_request' && steps.build_frontend.outcome == 'success'
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          [[ "$PR_BASE_SHA" =~ ^[0-9a-f]{40}$ ]] || exit 2
          git fetch --no-tags --depth=1 origin "$PR_BASE_SHA"
          git worktree add --detach "$RUNNER_TEMP/tf4-pr-base" "$PR_BASE_SHA"
          (
            cd "$RUNNER_TEMP/tf4-pr-base"
            npm ci
            npm run build
          )
          node scripts/emitted-js-budget.mjs snapshot \
            --dist "$RUNNER_TEMP/tf4-pr-base/dist" \
            --source-sha "$PR_BASE_SHA" \
            --out "$RUNNER_TEMP/tf4-base-emitted-js.json"
          node scripts/emitted-js-budget.mjs compare \
            --base "$RUNNER_TEMP/tf4-base-emitted-js.json" \
            --head "$RUNNER_TEMP/tf4-head-emitted-js.json" \
            --max-growth 10000 \
            --out "$RUNNER_TEMP/tf4-emitted-js-growth.json"

      - name: Dead code (advisory)
        run: npm run knip
        continue-on-error: true

  rust:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            librsvg2-dev \
            libssl-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri -> target

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest,cargo-machete

      - name: cargo check
        working-directory: src-tauri
        run: cargo check --all-targets --locked

      - name: cargo clippy
        if: success() || failure()
        working-directory: src-tauri
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: Unused crates (advisory)
        working-directory: src-tauri
        run: cargo machete
        continue-on-error: true

      - name: cargo nextest
        if: success() || failure()
        working-directory: src-tauri
        run: cargo nextest run --locked

      - name: Remote SSH parent-death and ownership acceptance
        working-directory: src-tauri
        run: cargo test --locked --test remote_ssh_guardian -- --test-threads=1

  rust-platforms:
    name: rust-test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri -> target

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest

      - name: cargo check
        working-directory: src-tauri
        run: cargo check --all-targets --locked

      - name: Windows native WebView2 host authority regressions
        if: runner.os == 'Windows' && (success() || failure())
        working-directory: src-tauri
        run: cargo test --locked --features tf-browser-native-runtime --bin clack-browser-host

      - name: Windows native WebView2 all-target strict Clippy
        if: runner.os == 'Windows' && (success() || failure())
        working-directory: src-tauri
        run: cargo clippy --all-targets --locked --features tf-browser-native-runtime -- -D warnings

      - name: cargo nextest
        if: success() || failure()
        working-directory: src-tauri
        run: cargo nextest run --locked --retries 2

      - name: Remote SSH native lifecycle regression
        if: success() || failure()
        working-directory: src-tauri
        run: cargo test --locked --lib remote_ssh

      - name: Remote SSH parent-death and ownership acceptance
        if: success() || failure()
        working-directory: src-tauri
        run: cargo test --locked --test remote_ssh_guardian -- --test-threads=1

  t3a-wasi:
    name: T3a WASI adversarial (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-22.04, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libssl-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri -> target
      - name: Shared staging, WASI adversarial and no-replay tests
        working-directory: src-tauri
        run: cargo test --locked --lib confinement
      - name: T3b registration, authorization and confined JSON functions
        if: success() || failure()
        working-directory: src-tauri
        run: cargo test --locked --lib custom_tools

  coverage:
    runs-on: ubuntu-22.04
    needs: rust
    steps:
      - uses: actions/checkout@v6

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            librsvg2-dev \
            libssl-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri -> target
          key: coverage

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov,cargo-nextest

      - name: Generate coverage
        working-directory: src-tauri
        run: cargo llvm-cov nextest --locked --lcov --output-path lcov.info

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v7
        with:
          name: lcov-report
          path: src-tauri/lcov.info
          if-no-files-found: error
