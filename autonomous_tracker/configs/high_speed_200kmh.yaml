# Software-only 200 km/h interception benchmark. No physical launcher backend exists.
system:
  mode: simulation
  loop_hz: 960
  solver_rate_hz: 120
  bounded_queue_size: 2

camera:
  backend: simulated
  width: 640
  height: 360
  fps: 480

target:
  detector: simulated
  width_m: 1.0
  height_m: 1.0
  minimum_confidence: 0.5
  association_gate_m: 12.0

estimator:
  model: constant_velocity
  process_noise: 0.5
  measurement_noise: 0.01
  maximum_prediction_horizon_s: 1.0
  track_timeout_s: 0.05
  max_missed_frames: 12
  maximum_covariance_trace: 100.0

environment:
  gravity_mps2: [0.0, 0.0, -9.80665]
  wind_mps: [2.0, -1.0, 0.0]
  air_density_kgpm3: 1.225

projectile:
  muzzle_velocity_mps: 300.0
  mass_kg: 0.02
  diameter_m: 0.0127
  drag_coefficient: 0.30
  drag_model: mach_curve
  speed_of_sound_mps: 343.0
  mach_drag_table:
    - [0.0, 0.30]
    - [0.7, 0.31]
    - [0.9, 0.38]
    - [1.0, 0.52]
    - [1.2, 0.42]
    - [2.0, 0.34]
    - [3.0, 0.30]
  aerodynamic_lift_coefficient: 0.0
  lift_axis: [0.0, 0.0, 1.0]
  enable_drag: true
  integration_timestep_s: 0.001
  maximum_integration_time_s: 1.0
  maximum_solver_iterations: 60

pan_tilt:
  backend: simulated
  update_rate_hz: 960
  safe_behavior: hold
  pan:
    minimum_rad: -3.14159265
    maximum_rad: 3.14159265
    maximum_velocity_radps: 15.0
    maximum_acceleration_radps2: 500.0
    maximum_jerk_radps3: 10000.0
    deadband_rad: 0.0002
    backlash_rad: 0.0005
    pid:
      kp: 12.0
      ki: 0.0
      kd: 0.0
      derivative_filter_hz: 100.0
      output_limit_radps: 15.0
      integral_limit: 0.5
      velocity_feedforward: 1.0
      acceleration_feedforward: 0.0
  tilt:
    minimum_rad: -1.3962634
    maximum_rad: 1.3962634
    maximum_velocity_radps: 15.0
    maximum_acceleration_radps2: 500.0
    maximum_jerk_radps3: 10000.0
    deadband_rad: 0.0002
    backlash_rad: 0.0005
    pid:
      kp: 12.0
      ki: 0.0
      kd: 0.0
      derivative_filter_hz: 100.0
      output_limit_radps: 15.0
      integral_limit: 0.5
      velocity_feedforward: 1.0
      acceleration_feedforward: 0.0

simulated_fire:
  alignment_tolerance_rad: 0.01745329
  alignment_radius_fraction: 0.5
  minimum_tracking_confidence: 0.6
  minimum_alignment_confidence: 0.55
  minimum_stability: 0.05
  maximum_target_age_s: 0.02
  cooldown_s: 0.05
  burst_interval_s: 0.02
  max_burst_count: 3
  hit_tolerance_m: 0.5

simulation:
  duration_s: 1.0
  random_seed: 200
  measurement_noise_m: 0.05
  dropped_frame_probability: 0.005
  camera_latency_s: 0.005
  camera_latency_jitter_s: 0.001
  capture_timestamp_jitter_s: 0.00005
  exposure_time_s: 0.0005
  target_occlusion_probability: 0.002
  targets:
    - trajectory: constant_velocity
      initial_position_m: [50.0, -22.5, 2.0]
      velocity_mps: [0.0, 55.5555556, 0.0]
      acceleration_mps2: [0.0, 0.0, 0.0]
      radius_m: 1.0
      speed_mps: 55.5555556

telemetry:
  enabled: false

logging:
  enabled: false
