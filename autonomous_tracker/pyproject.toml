[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "educational-autonomous-tracker"
version = "0.1.0"
description = "Safety-bounded robotics target tracker with simulated projectile interception"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
  "numpy>=2.1",
  "opencv-python>=4.10",
  "pydantic>=2.9",
  "PyYAML>=6.0",
  "scipy>=1.14",
]

[project.optional-dependencies]
hardware = ["pyserial>=3.5"]
yolo = ["ultralytics>=8.4,<9", "lap>=0.5.12,<0.6"]
telemetry = ["fastapi>=0.115", "uvicorn>=0.32", "websockets>=13"]
diagnostics = ["matplotlib>=3.9"]
dev = [
  "mypy>=1.13",
  "pytest>=8.3",
  "pytest-cov>=5.0",
  "ruff>=0.7",
  "scipy-stubs>=1.14",
  "types-PyYAML>=6.0",
]

[project.scripts]
tracker-simulate = "tracker.cli.simulate:main"
tracker-hardware = "tracker.cli.run_hardware:main"
tracker-calibrate = "tracker.cli.calibrate:main"

[tool.hatch.build.targets.wheel]
packages = ["src/tracker"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["tracker"]
