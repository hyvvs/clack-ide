[package]
name = "clack"
default-run = "clack"
version = "0.8.0"
description = "Clack - an AI-native IDE and agent workspace"
authors = ["crynta"]
license = "Apache-2.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "terax_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[features]
native-confinement-probes = []
# Explicit, non-default real Tauri persistence acceptance executable only.
# Never enable in normal Clack builds; no inference/model runtime is started.
lm11-b03-acceptance-harness = []
# Isolated real-WebView LM11 IPC acceptance with an authenticated synthetic
# child; no production engine/model bypass outside its fixed owned AppData.
lm11-authenticated-webview-acceptance = []
## Isolated real NVIDIA CUDA native acceptance log introspection; NEVER enabled
## in production builds or exposed through Tauri invoke permissions.
managed-cuda-native-acceptance = []
# Real Windows AppContainer browser host dependencies. The production host may
# be compiled only when an independently authenticated launcher owns its Job,
# broker channel and effective UDF. No interactive model tools are enabled by
# this feature alone.
tf-browser-native-runtime = ["dep:webview2-com", "dep:windows", "dep:base64"]
# Non-default, owned-network fixture only; never allow this broader fixture
# policy to become production browser network authority.
tf-browser-isolation-acceptance = ["tf-browser-native-runtime"]

[[bin]]
name = "clack-browser-host"
path = "src/bin/clack-browser-host.rs"
required-features = ["tf-browser-native-runtime"]

# This Windows-only, operator-invoked LM11 acceptance example has a crate-wide
# cfg(windows); without an opt-in target gate Cargo --all-targets tries to
# build an empty Linux/macOS crate and emits E0601 (missing main). Keep it out
# of normal CI/production and preserve explicit feature-gated acceptance.
[[example]]
name = "lm11_b03_native_restart_acceptance"
path = "examples/lm11_b03_native_restart_acceptance.rs"
required-features = ["lm11-b03-acceptance-harness"]

[[example]]
name = "lm11_authenticated_webview_acceptance"
path = "examples/lm11_authenticated_webview_acceptance.rs"
required-features = ["lm11-authenticated-webview-acceptance"]

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-opener = "2"
arboard = { version = "3.6.1", default-features = false, features = ["wayland-data-control"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
portable-pty = "0.9"
dirs = "6"
log = "0.4"
ignore = "0.4"
grep-regex = "0.1"
grep-searcher = "0.1"
grep-matcher = "0.1"
globset = "0.4"
nucleo-matcher = "0.3"
shared_child = "1"
tauri-plugin-log = "2"
tauri-plugin-dialog = "2"
tauri-plugin-os = "2"
tauri-plugin-store = "2"
tauri-plugin-process = "2"
tauri-plugin-notification = "2"
reqwest = { version = "0.12", default-features = false, features = [
	"rustls-tls",
	"stream",
] }
bytes = "1"
futures-util = "0.3"
tokio = { version = "1", default-features = false, features = ["rt", "sync", "time", "macros"] }
tempfile = "3"
notify = "8.2.0"
sha2 = "0.10"
getrandom = "0.3"
lopdf = { version = "0.44", default-features = false }
zip = { version = "4.6.1", default-features = false, features = ["deflate-flate2-zlib-rs"] }
sevenz-rust2 = "0.22.2"
wasmtime = { version = "=47.0.4", default-features = false, features = ["std", "runtime", "cranelift"] }
wasmtime-wasi = { version = "=47.0.4", default-features = false, features = ["p1"] }
wasm-encoder = { version = "=0.252.0", default-features = false, features = ["std"] }

[dev-dependencies]
proptest = "1"
flatbuffers = "=25.12.19"
wat = "=1.252.0"
tempfile = "3"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3.6", default-features = false, features = [
	"apple-native",
] }
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSString", "NSUserDefaults"] }

[target.'cfg(target_os = "windows")'.dependencies]
base64 = { version = "=0.22.1", optional = true }
webview2-com = { version = "=0.38.2", optional = true }
windows = { version = "=0.61.3", optional = true, features = ["Win32_System_Com", "Win32_UI_Shell"] }
keyring = { version = "3.6", default-features = false, features = [
	"windows-native",
] }
windows-sys = { version = "=0.61.2", features = [
	"Win32_Foundation",
	"Win32_Storage_FileSystem",
	"Win32_System_WindowsProgramming",
	"Win32_Security",
	"Win32_Security_Authorization",
	"Win32_Security_Isolation",
	"Win32_System_Pipes",
	"Win32_System_SystemInformation",
	"Win32_System_LibraryLoader",
	"Win32_System_Registry",
	"Win32_System_JobObjects",
	"Win32_System_IO",
	"Win32_System_Threading",
	"Win32_System_Diagnostics_ToolHelp",
	"Win32_UI_Controls",
	"Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-autostart = "2"
tauri-plugin-updater = "2"
tauri-plugin-window-state = "2"

[profile.dev]
incremental = true

[profile.release]
codegen-units = 1
lto = "fat"
opt-level = "s"
panic = "abort"
strip = true
